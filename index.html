<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Abrir material de PianoForAll</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f5f5f7; color: #1d1d1f; }
    main { width: min(34rem, calc(100% - 3rem)); text-align: center; padding: 2rem; background: white; border-radius: 1rem; box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 0.08); }
    a { display: inline-block; margin-top: 1rem; padding: 0.8rem 1.2rem; border-radius: 0.65rem; background: #7b1e3a; color: white; text-decoration: none; font-weight: 600; }
    p { line-height: 1.5; }
    @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f5f5f7; } main { background: #2c2c2e; } }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Preparando Apple Books…</h1>
    <p id="message">Si Safari solicita confirmación, acéptala. Si no se abre automáticamente, usa este enlace:</p>
    <a id="open" href="#">Abrir en Shortcuts</a>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const book = params.get("book");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const link = document.getElementById("open");
      let target;

      if (book === null || book === "") {
        // URL antigua sin parámetro: conserva el Shortcut funcional de respaldo.
        title.textContent = "Abriendo PianoForAll — Bk1-Pt1…";
        link.textContent = "Abrir Bk1-Pt1";
        target = "shortcuts://run-shortcut?name=PianoForAll%20%E2%80%94%20Bk1-Pt1";
      } else if (/^Bk[1-9][0-9]*-Pt[1-9][0-9]*$/.test(book)) {
        // Sólo acepta identificadores de libros con el formato previsto.
        title.textContent = "Abriendo PianoForAll — " + book + "…";
        link.textContent = "Abrir " + book;
        const shortcut = new URLSearchParams({
          name: "PianoForAll — Open Book",
          input: "text",
          text: book
        });
        target = "shortcuts://run-shortcut?" + shortcut.toString();
      } else {
        title.textContent = "Parámetro de libro no válido";
        message.textContent = "Usa el formato Bk1-Pt1, por ejemplo.";
        link.hidden = true;
        return;
      }

      link.href = target;
      window.addEventListener("DOMContentLoaded", () => {
        window.location.assign(target);
      }, { once: true });
    })();
  </script>
</body>
</html>
